name: pages

# Builds the website (site/, which imports the app's reactor and themes from src/renderer) and publishes it to the
# gh-pages branch, which GitHub Pages serves at https://coreylallojr.github.io/bridge/.
on:
  push:
    branches: [main]
    paths: ['site/**', 'src/renderer/reactor/**', 'src/renderer/theme.ts', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write   # to update the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Build the site
        run: |
          npm ci --ignore-scripts
          npx vite build --config site/vite.config.ts
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site/dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name=coreylallojr -c user.email=coreylallojr@users.noreply.github.com commit -q -m "Deploy the website (built from main ${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
