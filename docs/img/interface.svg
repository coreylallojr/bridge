<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Illustration of Bridge's main screen: groups on the left, the arc reactor with the clock and Start my day in the center, tiles below, widgets on the right.">
  <style>
    .f { font-family: Bahnschrift, 'Segoe UI', 'Arial Narrow', Arial, sans-serif; }
    .m { font-family: 'Cascadia Mono', Consolas, 'Courier New', monospace; }
    @keyframes spin { to { transform: rotate(360deg) } }
    @keyframes spinr { to { transform: rotate(-360deg) } }
    @keyframes flicker { 0%, 100% { opacity: 1 } 31% { opacity: .55 } 32% { opacity: 1 } 77% { opacity: .4 } 78% { opacity: 1 } }
    @keyframes breathe { 50% { transform: scale(1.1); opacity: .7 } }
    @keyframes fill { 0% { width: 0 } 70%, 100% { width: 188px } }
    @keyframes hl { 0%, 14% { stroke-opacity: 1; fill-opacity: .2 } 20%, 100% { stroke-opacity: .25; fill-opacity: .62 } }
    @keyframes cpu { 0%, 100% { width: 40px } 30% { width: 82px } 60% { width: 55px } }
    #core { animation: flicker 5s steps(1) infinite; }
    #r1 { transform-origin: 640px 250px; animation: spin 40s linear infinite; }
    #r2 { transform-origin: 640px 250px; animation: spinr 16s linear infinite; }
    #o1 { transform-origin: 640px 250px; animation: spin 10s linear infinite; }
    #o2 { transform-origin: 640px 250px; animation: spinr 14s linear infinite; }
    #halo { transform-origin: 640px 250px; animation: breathe 3.4s ease-in-out infinite; }
    #routine { animation: fill 6s ease-in-out infinite; }
    #cpubar { animation: cpu 4s ease-in-out infinite; }
    .t { animation: hl 9s linear infinite; }
    .t2 { animation-delay: 1.5s } .t3 { animation-delay: 3s } .t4 { animation-delay: 4.5s } .t5 { animation-delay: 6s } .t6 { animation-delay: 7.5s }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <radialGradient id="bg" cx=".5" cy=".35" r=".9"><stop offset="0" stop-color="#0a2a36"/><stop offset=".6" stop-color="#04121A"/><stop offset="1" stop-color="#010507"/></radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".25" stop-color="#9ff6fc" stop-opacity=".6"/><stop offset=".6" stop-color="#3FE0EE" stop-opacity=".16"/><stop offset="1" stop-color="#3FE0EE" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="big" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="1280" height="720" rx="10" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1279" height="719" rx="10" fill="none" stroke="#3FE0EE" stroke-opacity=".35"/>

  <!-- top bar: palette -->
  <text x="34" y="44" class="f" font-size="16" fill="#D9F7FB" letter-spacing="8">BRIDGE</text>
  <rect x="420" y="22" width="440" height="36" rx="3" fill="#04121A" fill-opacity=".8" stroke="#3FE0EE" stroke-opacity=".25"/>
  <circle cx="442" cy="40" r="6" fill="none" stroke="#6E9AA6" stroke-width="1.6"/><path d="M446.5 44.5 L451 49" stroke="#6E9AA6" stroke-width="1.6"/>
  <text x="462" y="45" class="f" font-size="15" fill="#6E9AA6">Search tiles, apps and commands</text>
  <text x="846" y="45" text-anchor="end" class="f" font-size="13" fill="#3FE0EE">Alt+Space</text>
  <text x="1246" y="44" text-anchor="end" class="m" font-size="12" fill="#6E9AA6" letter-spacing="2">⚙ SETTINGS</text>
  <path d="M0 76 H1280" stroke="#3FE0EE" stroke-opacity=".15"/>

  <!-- left rail: groups -->
  <rect x="0" y="77" width="230" height="643" fill="#04121A" fill-opacity=".5"/>
  <path d="M230 77 V720" stroke="#3FE0EE" stroke-opacity=".18"/>
  <g class="f" font-size="17">
    <rect x="0" y="104" width="230" height="44" fill="#3FE0EE" fill-opacity=".1"/><rect x="0" y="104" width="2" height="44" fill="#3FE0EE"/>
    <text x="28" y="132" fill="#D9F7FB">Work</text><text x="204" y="132" text-anchor="end" fill="#3FE0EE">6</text>
    <text x="28" y="178" fill="#6E9AA6">Tools</text><text x="204" y="178" text-anchor="end" fill="#6E9AA6">4</text>
    <text x="28" y="222" fill="#6E9AA6">Media</text><text x="204" y="222" text-anchor="end" fill="#6E9AA6">3</text>
    <text x="28" y="266" fill="#6E9AA6">Projects</text><text x="204" y="266" text-anchor="end" fill="#6E9AA6">5</text>
    <text x="28" y="680" font-size="16" fill="#3FE0EE">+ New group</text>
  </g>

  <!-- center: reactor + clock -->
  <g id="core">
    <circle cx="640" cy="250" r="150" fill="#3FE0EE" opacity=".1" filter="url(#big)"/>
    <circle id="halo" cx="640" cy="250" r="96" fill="url(#glow)"/>
    <circle id="r1" cx="640" cy="250" r="140" fill="none" stroke="#3FE0EE" stroke-width="3" stroke-dasharray="3 7" stroke-opacity=".5"/>
    <circle cx="640" cy="250" r="126" fill="none" stroke="#3FE0EE" stroke-opacity=".4"/>
    <circle cx="640" cy="250" r="92" fill="none" stroke="#9ff6fc" stroke-width="2" filter="url(#soft)"/>
    <circle id="r2" cx="640" cy="250" r="82" fill="none" stroke="#3FE0EE" stroke-width="1.3" stroke-dasharray="20 8 3 8" stroke-opacity=".8"/>
    <g id="o1"><ellipse cx="640" cy="250" rx="170" ry="52" fill="none" stroke="#1aa6d9" stroke-opacity=".55" transform="rotate(-22 640 250)"/></g>
    <g id="o2"><ellipse cx="640" cy="250" rx="158" ry="36" fill="none" stroke="#5cecf7" stroke-opacity=".4" transform="rotate(40 640 250)"/></g>
    <text x="640" y="262" text-anchor="middle" class="f" font-size="54" font-weight="300" fill="#fff">09:41</text>
    <text x="640" y="290" text-anchor="middle" class="m" font-size="11" fill="#3FE0EE" letter-spacing="5">MONDAY · NOV 3</text>
  </g>
  <g>
    <rect x="565" y="410" width="150" height="40" fill="#3FE0EE"/>
    <text x="640" y="436" text-anchor="middle" class="f" font-size="15" font-weight="bold" fill="#001014" letter-spacing="2">▶ START MY DAY</text>
  </g>

  <!-- tiles -->
  <g class="f">
    <g transform="translate(276 486)"><rect class="t" width="230" height="74" fill="#04161F" fill-opacity=".62" stroke="#3FE0EE" stroke-opacity=".25"/><text x="16" y="34" font-size="17" fill="#D9F7FB">Microsoft Learn</text><text x="16" y="56" font-size="12" fill="#6E9AA6" letter-spacing="1.5">LEARN.MICROSOFT.COM</text></g>
    <g transform="translate(525 486)"><rect class="t t2" width="230" height="74" fill="#04161F" fill-opacity=".62" stroke="#3FE0EE" stroke-opacity=".25"/><text x="16" y="34" font-size="17" fill="#D9F7FB">Documents</text><text x="16" y="56" font-size="12" fill="#6E9AA6" letter-spacing="1.5">FOLDER</text></g>
    <g transform="translate(774 486)"><rect class="t t3" width="230" height="74" fill="#04161F" fill-opacity=".62" stroke="#3FE0EE" stroke-opacity=".25"/><text x="16" y="34" font-size="17" fill="#D9F7FB">Calculator</text><text x="16" y="56" font-size="12" fill="#6E9AA6" letter-spacing="1.5">APP · calc</text></g>
    <g transform="translate(276 576)"><rect class="t t4" width="230" height="74" fill="#04161F" fill-opacity=".62" stroke="#3FE0EE" stroke-opacity=".25"/><text x="16" y="34" font-size="17" fill="#D9F7FB">Notepad</text><text x="16" y="56" font-size="12" fill="#6E9AA6" letter-spacing="1.5">APP</text></g>
    <g transform="translate(525 576)"><rect class="t t5" width="230" height="74" fill="#04161F" fill-opacity=".62" stroke="#3FE0EE" stroke-opacity=".25"/><text x="16" y="34" font-size="17" fill="#D9F7FB">Build &amp; test</text><text x="16" y="56" font-size="12" fill="#6E9AA6" letter-spacing="1.5">SCRIPT</text></g>
    <g transform="translate(774 576)"><rect class="t t6" width="230" height="74" fill="#04161F" fill-opacity=".62" stroke="#3FE0EE" stroke-opacity=".25"/><text x="16" y="34" font-size="17" fill="#D9F7FB">Team site</text><text x="16" y="56" font-size="12" fill="#6E9AA6" letter-spacing="1.5">LINK</text></g>
  </g>

  <!-- right rail: widgets -->
  <rect x="1050" y="77" width="230" height="643" fill="#04121A" fill-opacity=".5"/>
  <path d="M1050 77 V720" stroke="#3FE0EE" stroke-opacity=".18"/>
  <g class="f">
    <rect x="1070" y="104" width="190" height="96" fill="#04121A" fill-opacity=".6" stroke="#3FE0EE" stroke-opacity=".2"/>
    <text x="1084" y="128" font-size="12" fill="#FFB547" letter-spacing="3">ROUTINE</text>
    <text x="1084" y="154" font-size="15" fill="#D9F7FB">Start my day</text>
    <text x="1084" y="174" font-size="12" fill="#6E9AA6">5 apps · 3 monitors</text>
    <rect x="1071" y="188" width="188" height="4" fill="#3FE0EE" fill-opacity=".15"/><rect id="routine" x="1071" y="188" width="0" height="4" fill="#3FE0EE"/>
    <rect x="1070" y="216" width="190" height="96" fill="#04121A" fill-opacity=".6" stroke="#3FE0EE" stroke-opacity=".2"/>
    <text x="1084" y="240" font-size="12" fill="#FFB547" letter-spacing="3">RECENT</text>
    <text x="1084" y="264" font-size="14" fill="#D9F7FB">Documents</text><text x="1084" y="286" font-size="14" fill="#6E9AA6">Calculator</text>
    <rect x="1070" y="328" width="190" height="96" fill="#04121A" fill-opacity=".6" stroke="#3FE0EE" stroke-opacity=".2"/>
    <text x="1084" y="352" font-size="12" fill="#FFB547" letter-spacing="3">PC</text>
    <text x="1084" y="378" font-size="13" fill="#6E9AA6">CPU</text><rect x="1124" y="370" width="120" height="8" fill="#3FE0EE" fill-opacity=".12"/><rect id="cpubar" x="1124" y="370" width="40" height="8" fill="#3FE0EE"/>
    <text x="1084" y="404" font-size="13" fill="#6E9AA6">RAM</text><rect x="1124" y="396" width="120" height="8" fill="#3FE0EE" fill-opacity=".12"/><rect x="1124" y="396" width="52" height="8" fill="#6CF2B0"/>
  </g>
  <text x="1246" y="702" text-anchor="end" class="m" font-size="10" fill="#6E9AA6" letter-spacing="2">ILLUSTRATION</text>
</svg>
