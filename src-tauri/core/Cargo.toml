[package]
name = "bridge-core"
version = "0.3.0"
edition = "2021"
description = "Bridge's pure logic: profile, detection, matching, CLI, planning. No UI, no Win32."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha1 = "0.10"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
