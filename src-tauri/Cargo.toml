[workspace]
members = [".", "core", "sys", "shell"]
resolver = "2"

[workspace.dependencies]
bridge-core = { path = "core" }
bridge-sys = { path = "sys", features = ["webview"] }
bridge-shell = { path = "shell" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
window-vibrancy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["gzip"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "rt-multi-thread", "macros"] }
futures = "0.3"
sha1 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clipboard-win = "5"
png = "0.17"
url = "2"
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell",
  "Win32_UI_Shell_Common", "Win32_UI_Controls", "Win32_System_Com", "Win32_System_Threading", "Win32_System_SystemInformation",
  "Win32_System_Diagnostics_Debug", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory",
  "Win32_UI_HiDpi", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Ole", "Win32_System_DataExchange",
] }
tempfile = "3"
tiny_http = "0.12"
embed-resource = "3"

[package]
name = "bridge"
version = "0.3.0"
edition = "2021"
description = "A personal command center for Windows"
authors = ["Corey Lallo"]
license-file = "../LICENSE.md"
repository = "https://github.com/coreylallojr/bridge"
default-run = "bridge"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bridge-core.workspace = true
bridge-sys.workspace = true
bridge-shell.workspace = true
tauri.workspace = true
tauri-plugin-global-shortcut.workspace = true
window-vibrancy.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
chrono.workspace = true
sha1.workspace = true
windows.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
# Serve the built frontend from inside the exe.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 1
